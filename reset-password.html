<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer Contraseña - Abarrotes El Rosal</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <meta name="description" content="Restablece la contraseña de tu cuenta de Abarrotes El Rosal.">
  <meta name="theme-color" content="#004795">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Abarrotes El Rosal">
  <meta property="og:locale" content="es_MX">
  <meta property="og:title" content="Restablecer Contraseña - Abarrotes El Rosal">
  <meta property="og:description" content="Restablece la contraseña de tu cuenta de Abarrotes El Rosal.">
  <meta property="og:image" content="img/logo.png">
  <meta name="twitter:card" content="summary">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #f4f5f7;
      color: #303030;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
      padding: 32px 28px;
      text-align: center;
    }

    .card img.logo {
      height: 36px;
      width: auto;
      margin-bottom: 18px;
    }

    .card h1 {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 22px;
    }

    .field {
      text-align: left;
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      height: 48px;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 16px; /* 16px o más: el iPhone no hace zoom al tocar el campo */
      font-family: inherit;
      color: #303030;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }

    .field input:focus {
      border-color: #004795;
      box-shadow: 0 0 0 3px rgba(0, 71, 149, 0.12);
    }

    .btn {
      display: block;
      width: 100%;
      height: 50px;
      background: #004795;
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.18s;
    }

    .btn:hover { background: #002f6c; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .msg {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
    }

    .msg.success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .msg.error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }
  </style>
</head>
<body>

  <div class="card">
    <img class="logo" src="img/logo.png" alt="Abarrotes El Rosal">
    <h1>Nueva contraseña</h1>

    <div class="field">
      <label for="new-pass">Nueva contraseña</label>
      <input type="password" id="new-pass" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
    </div>

    <div class="field">
      <label for="confirm-pass">Confirmar contraseña</label>
      <input type="password" id="confirm-pass" placeholder="Repite tu contraseña" autocomplete="new-password">
    </div>

    <button class="btn" id="save-btn" onclick="savePassword()">Guardar</button>

    <div class="msg" id="msg"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    // Supabase detecta el token automáticamente en la URL
    window.supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        // Token válido — formulario ya visible, no hacer nada extra
        console.log('Sesión de recuperación detectada');
      }
    });

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + type;
      el.style.display = 'block';
    }

    async function savePassword() {
      const pass  = document.getElementById('new-pass').value;
      const pass2 = document.getElementById('confirm-pass').value;
      const btn   = document.getElementById('save-btn');

      document.getElementById('msg').style.display = 'none';

      if (!pass || !pass2) {
        showMsg('Por favor completa ambos campos.', 'error');
        return;
      }

      if (pass !== pass2) {
        showMsg('Las contraseñas no coinciden.', 'error');
        return;
      }

      if (pass.length < 6) {
        showMsg('La contraseña debe tener al menos 6 caracteres.', 'error');
        return;
      }

      btn.textContent = 'Guardando...';
      btn.disabled = true;

      const { error } = await window.supabaseClient.auth.updateUser({ password: pass });

      btn.textContent = 'Guardar';
      btn.disabled = false;

      if (error) {
        showMsg(error.message || 'Error al actualizar la contraseña.', 'error');
      } else {
        showMsg('Contraseña actualizada. Redirigiendo...', 'success');
        btn.style.display = 'none';
        setTimeout(() => { window.location.href = 'index.html'; }, 2000);
      }
    }

    // Permitir Enter en los campos
    ['new-pass', 'confirm-pass'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') savePassword();
      });
    });
  </script>

</body>
</html>
